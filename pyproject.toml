[project]
name = "ocean-container-routing-example"
version = "1.0.0"
description = "Ocean container routing, repair and continuous planning on the hosted Helixor Solver"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
compare = ["ortools>=9.10"]
test = ["pytest>=8", "ortools>=9.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
